<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #ffca28;
            padding-bottom: 10px;
        }
        .enlaces-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .link-btn.vuelta {
            background-color: #28a745;
        }
        .link-btn.vuelta:hover {
            background-color: #1e7e34;
        }
        .info-paradas {
            font-size: 12px;
            color: #ffffffd0;
            margin-top: 5px;
            font-weight: normal;
            display: block;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Horarios FGC</h2>
        <div class="enlaces-container">
            
            <!-- Formulario de Ida (Trabajo) -->
            <form action="https://fgc.cat" method="GET" target="_blank">
                <input type="hidden" name="from_address" value="Sant Josep">
                <input type="hidden" name="from_lat" value="41.360700975">
                <input type="hidden" name="from_lng" value="2.10991665">
                <input type="hidden" name="from_code" value="SP">
                
                <input type="hidden" name="to_address" value="Barcelona-Plaça Espanya">
                <input type="hidden" name="to_lat" value="41.3745059">
                <input type="hidden" name="to_lng" value="2.1484134">
                <input type="hidden" name="to_code" value="PE">
                
                <input type="hidden" name="datetime_option" value="0">
                <input type="hidden" name="range_option" value="0">
                
                <button type="submit" class="link-btn">
                    Ir trabajo
                    <span class="info-paradas">Sant Josep ➔ Pl. Espanya</span>
                </button>
            </form>
            
            <!-- Formulario de Vuelta (Casa) -->
            <form action="https://fgc.cat" method="GET" target="_blank">
                <input type="hidden" name="from_address" value="Barcelona-Plaça Espanya">
                <input type="hidden" name="from_lat" value="41.3745059">
                <input type="hidden" name="from_lng" value="2.1484134">
                <input type="hidden" name="from_code" value="PE">
                
                <input type="hidden" name="to_address" value="Sant Josep">
                <input type="hidden" name="to_lat" value="41.360700975">
                <input type="hidden" name="to_lng" value="2.10991665">
                <input type="hidden" name="to_code" value="SP">
                
                <input type="hidden" name="datetime_option" value="0">
                <input type="hidden" name="range_option" value="0">
                
                <button type="submit" class="link-btn vuelta">
                    Vuelta de trabajo
                    <span class="info-paradas">Pl. Espanya ➔ Sant Josep</span>
                </button>
            </form>
            
        </div>
    </div>

</body>
</html>
