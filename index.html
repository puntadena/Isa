<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #ffca28;
            padding-bottom: 10px;
        }
        .enlaces-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .link-btn.vuelta {
            background-color: #28a745;
        }
        .link-btn.vuelta:hover {
            background-color: #1e7e34;
        }
        .info-paradas {
            font-size: 12px;
            color: #ffffffd0;
            margin-top: 5px;
            font-weight: normal;
            display: block;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Horarios FGC</h2>
        <div class="enlaces-container">
            
            <!-- Botón Ir al trabajo -->
            <button class="link-btn" onclick="enviarBusquedaFGC('SP', 'Sant Josep', '41.360700975', '2.10991665', 'PE', 'Barcelona-Plaça Espanya', '41.3745059', '2.1484134')">
                Ir trabajo
                <span class="info-paradas">Sant Josep ➔ Pl. Espanya</span>
            </button>
            
            <!-- Botón Vuelta del trabajo -->
            <button class="link-btn vuelta" onclick="enviarBusquedaFGC('PE', 'Barcelona-Plaça Espanya', '41.3745059', '2.1484134', 'SP', 'Sant Josep', '41.360700975', '2.10991665')">
                Vuelta de trabajo
                <span class="info-paradas">Pl. Espanya ➔ Sant Josep</span>
            </button>
            
        </div>
    </div>

    <!-- Formulario oculto que procesa el envío nativo POST/GET a la plataforma de FGC -->
    <form id="fgcForm" action="https://fgc.cat" method="GET" target="_blank" style="display:none;">
        <input type="hidden" name="from_code" id="f_code">
        <input type="hidden" name="from_address" id="f_address">
        <input type="hidden" name="from_lat" id="f_lat">
        <input type="hidden" name="from_lng" id="f_lng">
        
        <input type="hidden" name="to_code" id="t_code">
        <input type="hidden" name="to_address" id="t_address">
        <input type="hidden" name="to_lat" id="t_lat">
        <input type="hidden" name="to_lng" id="t_lng">
        
        <input type="hidden" name="datetime_option" value="0">
        <input type="hidden" name="range_option" value="0">
        <input type="hidden" name="date" id="f_date">
        <input type="hidden" name="time_from" id="f_time">
    </form>

    <script>
        function enviarBusquedaFGC(origCod, origNom, origLat, origLng, destCod, destNom, destLat, destLng) {
            // Calcular fecha y hora actual en el momento del click
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const ano = ahora.getFullYear();
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');

            // Insertar datos dinámicos en el formulario estructurado
            document.getElementById('f_code').value = origCod;
            document.getElementById('f_address').value = origNom;
            document.getElementById('f_lat').value = origLat;
            document.getElementById('f_lng').value = origLng;

            document.getElementById('t_code').value = destCod;
            document.getElementById('t_address').value = destNom;
            document.getElementById('t_lat').value = destLat;
            document.getElementById('t_lng').value = destLng;

            document.getElementById('f_date').value = `${dia}-${mes}-${ano}`;
            document.getElementById('f_time').value = `${horas}:${minutos}`;

            // Enviar el formulario emulando la acción de su buscador
            document.getElementById('fgcForm').submit();
        }
    </script>

</body>
</html>
