<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #ffca28;
            padding-bottom: 10px;
        }
        .enlaces-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .link-btn.vuelta {
            background-color: #28a745;
        }
        .link-btn.vuelta:hover {
            background-color: #1e7e34;
        }
        .info-paradas {
            font-size: 12px;
            color: #ffffffd0;
            margin-top: 5px;
            font-weight: normal;
            display: block;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Horarios FGC</h2>
        <div class="enlaces-container">
            
            <!-- Botón Ir al trabajo -->
            <button class="link-btn" onclick="buscarFGC('ida')">
                Ir trabajo
                <span class="info-paradas">Sant Josep ➔ Pl. Espanya</span>
            </button>
            
            <!-- Botón Vuelta del trabajo -->
            <button class="link-btn vuelta" onclick="buscarFGC('vuelta')">
                Vuelta de trabajo
                <span class="info-paradas">Pl. Espanya ➔ Sant Josep</span>
            </button>
            
        </div>
    </div>

    <script>
        function buscarFGC(trayecto) {
            // Obtener fecha y hora actual localmente
            const ahora = new Date();
            
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const ano = ahora.getFullYear();
            const fechaFormateada = `${dia}-${mes}-${ano}`;
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const horaFormateada = `${horas}%3A${minutos}`;

            // Coordenadas y códigos exactos provistos por el sistema FGC
            const paramSantJosep = "from_address=Sant+Josep&from_lat=41.360700975&from_lng=2.10991665&from_code=SP";
            const paramPlEspanya = "to_address=Barcelona-Pla%C3%A7a+Espanya&to_lat=41.3745059&to_lng=2.1484134&to_code=PE";

            let urlBase = "https://fgc.cat?";
            let urlFinal = "";

            if (trayecto === 'ida') {
                urlFinal = `${urlBase}${paramSantJosep}&${paramPlEspanya}&datetime_option=0&range_option=0&date=${fechaFormateada}&time_from=${horaFormateada}`;
            } else {
                // Invertir origen y destino para la vuelta
                const paramSantJosepVuelta = paramSantJosep.replace(/from_/g, 'to_');
                const paramPlEspanyaVuelta = paramPlEspanya.replace(/to_/g, 'from_');
                urlFinal = `${urlBase}${paramPlEspanyaVuelta}&${paramSantJosepVuelta}&datetime_option=0&range_option=0&date=${fechaFormateada}&time_from=${horaFormateada}`;
            }

            // Abrir la búsqueda en una pestaña nueva
            window.open(urlFinal, '_blank');
        }
    </script>

</body>
</html>
