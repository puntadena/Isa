<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #ffca28;
            padding-bottom: 10px;
        }
        .enlaces-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .link-btn.vuelta {
            background-color: #28a745;
        }
        .link-btn.vuelta:hover {
            background-color: #1e7e34;
        }
        .info-paradas {
            font-size: 12px;
            color: #ffffffd0;
            margin-top: 5px;
            font-weight: normal;
            display: block;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Horarios FGC</h2>
        <div class="enlaces-container">
            
            <!-- Enlace dinámico Ir al trabajo -->
            <a id="btn-ida" class="link-btn" href="#" target="_blank">
                Ir trabajo
                <span class="info-paradas">Sant Josep ➔ Pl. Espanya</span>
            </a>
            
            <!-- Enlace dinámico Vuelta del trabajo -->
            <a id="btn-vuelta" class="link-btn vuelta" href="#" target="_blank">
                Vuelta de trabajo
                <span class="info-paradas">Pl. Espanya ➔ Sant Josep</span>
            </a>
            
        </div>
    </div>

    <script>
        function actualizarEnlaces() {
            const ahora = new Date();
            
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const ano = ahora.getFullYear();
            const fechaActual = `${dia}-${mes}-${ano}`;
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const horaActual = `${horas}%3A${minutos}`;

            // URLs exactas construidas con los parámetros nativos de FGC y el tiempo real
            const urlIda = `https://fgc.cat{fechaActual}&time_from=${horaActual}`;
            const urlVuelta = `https://fgc.cat{fechaActual}&time_from=${horaActual}`;

            // Inyectar las URLs directamente en los atributos href del HTML
            document.getElementById('btn-ida').href = urlIda;
            document.getElementById('btn-vuelta').href = urlVuelta;
        }

        // Ejecutar inmediatamente al abrir y refrescar cada 1 segundo
        actualizarEnlaces();
        setInterval(actualizarEnlaces, 1000);
    </script>

</body>
</html>
